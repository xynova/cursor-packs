# Standard Go quality jobs for GitLab Go modules.
# Copy to .gitlab/ci/golang-quality.yml and include from .gitlab-ci.yml.

.go-cache:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .gomodcache/
      - .gocache/

.go-base:
  stage: quality
  image: golang:${GO_VERSION}-bookworm
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOMODCACHE: $CI_PROJECT_DIR/.gomodcache
    GOCACHE: $CI_PROJECT_DIR/.gocache
  extends: .go-cache
  before_script:
    - go version

go:mod:
  extends: .go-base
  script:
    - go mod download
    - go mod verify
    - cp go.mod go.mod.bak && cp go.sum go.sum.bak
    - go mod tidy
    - diff -u go.mod.bak go.mod
    - diff -u go.sum.bak go.sum

go:vet:
  extends: .go-base
  script:
    - go vet ./...

go:test:
  extends: .go-base
  script:
    - go test -race -count=1 ./...

go:build:
  extends: .go-base
  script:
    - go build ./...
