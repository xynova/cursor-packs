# Tag-triggered GoReleaser publish (v* tags).
# Requires prepare-go-forge: packages, ADMIN_PACKAGES/ADMIN_RELEASES, CI_JOB_TOKEN.
# Include from .gitlab-ci.yml: local: .gitlab/ci/goreleaser-release.yml
#
# Pin the golang image to go.mod's go version when goreleaser/goreleaser
# ships an older toolchain. Keep changelog.use: git in .goreleaser.yaml.

release:
  stage: release
  image:
    name: golang:1.27-bookworm
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  variables:
    GIT_DEPTH: "0"
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - GOBIN=/usr/local/bin go install github.com/goreleaser/goreleaser/v2@v2.9.0
    - goreleaser release --clean
  needs: []
